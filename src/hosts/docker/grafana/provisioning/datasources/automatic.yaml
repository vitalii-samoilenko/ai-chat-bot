apiVersion: 1

datasources:
  - name: loki
    type: loki
    uid: logs
    access: proxy
    url: http://loki:8080
    user:
    database:
    basicAuth:
    isDefault: true
    editable: true

  - name: prometheus
    type: prometheus
    uid: metrics
    access: proxy
    url: http://prometheus:8080
    user:
    database:
    basicAuth: false
    isDefault: false
    jsonData:
      httpMethod: POST
    editable: true

  - name: tempo
    type: tempo
    uid: traces
    access: proxy
    url: http://tempo:8080
    user:
    database:
    basicAuth: false
    isDefault: false
    editable: true
